name: Upkeep (links & freshness)

# Daily link check of every entry URL plus a freshness check (updated/added older than 90 days).
# Maintains ONE tracking issue titled "Link & freshness report" (label: upkeep):
#   problems found -> create it, or update its body in place
#   all clear      -> close it with a short comment (if open); otherwise stay quiet
# Never edits or deletes entries.
on:
  schedule:
    - cron: '17 4 * * *'   # 06:17 Europe/Stockholm (summer time)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upkeep
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check links and freshness
        id: check
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/linkcheck.mjs --out upkeep
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: upkeep-report
          path: upkeep/
          retention-days: 14
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Link & freshness report"
          num=$(gh issue list --label upkeep --state open --limit 50 --json number,title \
                --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty" 2>/dev/null || true)
          if [ "${PROBLEMS:-0}" -gt 0 ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file upkeep/report.md
              echo "Updated issue #$num ($PROBLEMS problems)"
            else
              gh label create upkeep --color FBCA04 --description "Automated link & freshness checks" 2>/dev/null || true
              gh issue create --title "$TITLE" --label upkeep --body-file upkeep/report.md
            fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "All links and freshness checks pass as of $(date -u +%F) ([run]($RUN_URL)). Closing."
            gh issue close "$num"
            echo "Closed issue #$num"
          else
            echo "All clear; nothing to do."
          fi
