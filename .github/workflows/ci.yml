name: CI

# Validates content and builds the site for pull requests.
# Also dispatchable on any branch: the submission workflow triggers it on the PR branches it opens,
# because PRs created with GITHUB_TOKEN don't trigger pull_request workflows by themselves.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate content (annotations + job summary on failure)
        run: node scripts/validate.mjs
      - name: Build
        run: node scripts/build.mjs
      - name: Check dist
        run: node scripts/check-dist.mjs
