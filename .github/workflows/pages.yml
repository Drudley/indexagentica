name: Validate, build and deploy to GitHub Pages

# Pull requests are covered by ci.yml.
on:
  push:
    branches: [main]
  # Rebuild every 6 hours (off-minute) so the usage numbers baked into every footer stay fresh
  # (scripts/lib/usage.mjs; the inline script refreshes them live when the stats endpoint is reachable).
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      indexnow_full:
        description: Ping IndexNow with every sitemap URL instead of only new/changed ones
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: sitemap <lastmod> for template-driven pages (/agents/, /schema/) is the date of the
          # last commit touching their sources (scripts/build.mjs). The repo is small.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Validate content
        run: node scripts/validate.mjs
      - name: Build
        env:
          # Canonical URL. Pinned explicitly (repo variable SITE_URL can override) rather than taken from
          # configure-pages' base_url, which would flip to http:// if HTTPS enforcement were ever turned off.
          # The custom domain itself lives in Settings > Pages (cname=indexagentica.com); with Actions
          # deployments a CNAME file in the artifact is ignored, so none is written.
          SITE_URL: ${{ vars.SITE_URL || 'https://indexagentica.com' }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          echo "Pages base_url: ${PAGES_BASE_URL:-n/a}  ->  building for $SITE_URL"
          node scripts/build.mjs
      - name: Check dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://indexagentica.com' }}
        run: node scripts/check-dist.mjs
      - name: IndexNow diff (new/changed URLs vs the live sitemap)
        if: github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://indexagentica.com' }}
          FULL: ${{ inputs.indexnow_full && 'true' || 'false' }}
        run: node scripts/indexnow.mjs diff dist/sitemap.xml indexnow/urls.txt $([ "$FULL" = true ] && echo --full)
      - name: Upload IndexNow list
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: indexnow
          path: indexnow/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Without this the action's tar step excludes dotfiles, which would silently drop
          # dist/.well-known/* (copied from static/) and .nojekyll.
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Pings IndexNow (Bing, Yandex, Seznam, Naver, Yep, ...; engines share submissions) once per deploy with
  # the URLs whose <lastmod> changed. Waits for the key file and new sitemap to be live. Never fails the run:
  # 429 and other errors are warnings. Google has no ping; it reads the Sitemap: line in robots.txt.
  indexnow:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: indexnow
          path: indexnow
      - name: Ping IndexNow
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://indexagentica.com' }}
        run: node scripts/indexnow.mjs submit indexnow/urls.txt
