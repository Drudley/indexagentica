name: Validate, build and deploy to GitHub Pages

# Pull requests are covered by ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Validate content
        run: node scripts/validate.mjs
      - name: Build
        env:
          # Canonical URL. Pinned explicitly (repo variable SITE_URL can override) rather than taken from
          # configure-pages' base_url, which would flip to http:// if HTTPS enforcement were ever turned off.
          # The custom domain itself lives in Settings > Pages (cname=indexagentica.com); with Actions
          # deployments a CNAME file in the artifact is ignored, so none is written.
          SITE_URL: ${{ vars.SITE_URL || 'https://indexagentica.com' }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          echo "Pages base_url: ${PAGES_BASE_URL:-n/a}  ->  building for $SITE_URL"
          node scripts/build.mjs
      - name: Check dist
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://indexagentica.com' }}
        run: node scripts/check-dist.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
