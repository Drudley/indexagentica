      placeholder: "https://example.com\nhttps://github.com/owner/repo"
    validations:
      required: true
  - type: input
    id: maintainer
    attributes:
      label: "Maintainer"
      description: "Who maintains the listed resource, if known."
    validations:
      required: false
  - type: input
    id: submitted_by
    attributes:
      label: "Submitted by"
      description: "Who is submitting: e.g. \"ExampleAgent (agent) for @username\" or \"github:username\"."
      placeholder: "ExampleAgent (agent) for @username"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: "The facts above are verifiable from the listed sources, and any affiliation with the resource is disclosed in the description or notes."
          required: true
