# GENERATED by scripts/sync.mjs from scripts/lib/forms.mjs and schema/categories.json. Do not edit by hand.
name: New entry
description: Submit a new resource for the Index Agentica directory (agents welcome).
title: "[New entry]: "
labels: ["submission", "new-entry"]
body:
  - type: markdown
    attributes:
      value: "Fields map 1:1 to the [entry schema](https://indexagentica.com/schema/). A maintainer reviews the submission; adding the `approved` label opens a pull request automatically. Prefer a direct PR? See https://indexagentica.com/agents/#contribute"
  - type: input
    id: id
    attributes:
      label: "Entry id"
      description: "Kebab-case slug, unique across the directory; becomes the filename content/<category>/<id>.json."
      placeholder: "my-tool"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "Name"
      description: "Display name (max 120 chars)."
      placeholder: "My Tool"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "Category"
      description: "skills: Reusable agent skills, skill packs and prompt-and-script bundles an agent can load. | harnesses: Agent runtimes, frameworks and harnesses: CLIs, SDKs and orchestration loops. | mcp-servers: Model Context Protocol servers, local or remote, that give agents tools and data. | tools: Standalone tools agents use: browsers, sandboxes, code execution, search and more. | protocols: Open protocols and standards for agents and agent interoperability. | apis: Agent-friendly web APIs with clear docs, OpenAPI specs or llms.txt. | information: Knowledge sources, documentation hubs, datasets, benchmarks and research. | finance-payments: Payment rails, wallets, billing and financial infrastructure usable by agents. | directories: Other directories, registries, awesome-lists and link hubs for the agent ecosystem."
      options:
        - "skills"
        - "harnesses"
        - "mcp-servers"
        - "tools"
        - "protocols"
        - "apis"
        - "information"
        - "finance-payments"
        - "directories"
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: "Summary"
      description: "One neutral line, 10-200 characters, plain text (no marketing copy)."
      placeholder: "What it does for agents, in one line."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: "Homepage URL"
      description: "Canonical homepage, https://..."
      placeholder: "https://example.com"
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: "Repository URL"
      description: "Source repository, if any."
      placeholder: "https://github.com/owner/repo"
    validations:
      required: false
  - type: input
    id: docs
    attributes:
      label: "Docs URL"
      description: "Documentation URL, if any."
      placeholder: "https://example.com/docs"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Optional longer description in markdown."
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: "Tags"
      description: "Comma-separated kebab-case tags (max 20)."
      placeholder: "web-search, mcp, python"
    validations:
      required: false
  - type: input
    id: license
    attributes:
      label: "License"
      description: "SPDX identifier where possible (MIT, Apache-2.0) or \"proprietary\"."
      placeholder: "MIT"
    validations:
      required: false
  - type: dropdown
    id: pricing
    attributes:
      label: "Pricing"
      description: "Leave empty if unknown."
      options:
        - "free"
        - "freemium"
        - "paid"
        - "open-source"
        - "unknown"
    validations:
      required: false
  - type: dropdown
    id: status
    attributes:
      label: "Status"
      description: "Leave empty if unknown."
      options:
        - "active"
        - "beta"
        - "deprecated"
        - "unknown"
    validations:
      required: false
  - type: input
    id: agent_access_llms_txt
    attributes:
      label: "llms.txt URL"
      description: "URL of the resource's llms.txt, if it has one."
      placeholder: "https://example.com/llms.txt"
    validations:
      required: false
  - type: input
    id: agent_access_openapi
    attributes:
      label: "OpenAPI URL"
      description: "URL of an OpenAPI spec, if any."
      placeholder: "https://example.com/openapi.json"
    validations:
      required: false
  - type: input
    id: agent_access_mcp_endpoint
    attributes:
      label: "MCP endpoint"
      description: "Remote MCP endpoint (http/https/ws/wss), if any."
      placeholder: "https://example.com/mcp"
    validations:
      required: false
  - type: dropdown
    id: agent_access_auth
    attributes:
      label: "Auth"
      description: "How agents authenticate. Leave empty if not applicable."
      options:
        - "none"
        - "api-key"
        - "oauth"
        - "other"
    validations:
      required: false
  - type: textarea
    id: agent_access_notes
    attributes:
      label: "Agent access notes"
      description: "Anything an agent needs to know to use it (max 1000 chars)."
    validations:
      required: false
  - type: input
    id: related
    attributes:
